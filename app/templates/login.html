{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block chrome %}{% endblock %}
{% block bottomnav %}{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-wrap">
    <div class="card">
      <div class="logo">✈️</div>
      <h1>Agent IA Travel</h1>
      <p class="muted">Dashboard LAN — connexion requise.</p>
      {% if error %}<div class="banner error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="password" name="password" placeholder="Mot de passe"
               autofocus autocomplete="current-password" required
               aria-label="Mot de passe">
        <button type="submit">Se connecter</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
