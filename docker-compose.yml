services:
  agent-travel:
    build: .
    restart: unless-stopped
    env_file: .env
    # Dashboard web LAN uniquement (port 8080). NE PAS rediriger ce port vers
    # internet — accès distant via le VPN/Tailscale du NAS.
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
